<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد (۴۰۴) | نئون انیمه</title>
    <meta name="description" content="صفحه‌ی مورد نظر در نئون انیمه پیدا نشد.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0a0c">
    <script>
        // Apply the saved theme before paint and keep browser chrome in sync.
        (function () {
            var theme = 'dark';
            try {
                if (localStorage.getItem('neon_theme') === 'light') {
                    theme = 'light';
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {}
            document.querySelector('meta[name="theme-color"]').setAttribute(
                'content', theme === 'light' ? '#f4f1f9' : '#0a0a0c'
            );
        })();
    </script>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .nf-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; position: relative; z-index: 2; }
        .nf-code { font-family: 'Orbitron', sans-serif; font-size: clamp(5rem, 20vw, 11rem); font-weight: 900; line-height: 1; color: var(--accent); text-shadow: 0 0 40px var(--accent-glow); }
        .nf-wrap h1 { font-size: 1.8rem; margin: 10px 0; }
        .nf-wrap p { color: var(--text-muted); max-width: 460px; line-height: 1.9; margin-bottom: 30px; }
        .nf-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .nf-actions .btn { text-decoration: none; }
    </style>
</head>
<body>
    <div class="ambient-bg"><div class="glow-orb purple"></div><div class="glow-orb blue"></div></div>
    <main class="nf-wrap">
        <div class="nf-code">404</div>
        <h1>این صفحه توی هیچ فصلی پخش نشده!</h1>
        <p>آدرسی که وارد کردید وجود ندارد یا جابه‌جا شده است. می‌توانید به صفحه‌ی اصلی برگردید یا انیمه‌ی مورد نظرتان را جست‌وجو کنید.</p>
        <div class="nf-actions">
            <a href="index.html" class="btn btn-play">بازگشت به خانه</a>
            <a href="index.html#trendingSection" class="btn btn-info">مرور انیمه‌ها</a>
        </div>
    </main>
</body>
</html>
