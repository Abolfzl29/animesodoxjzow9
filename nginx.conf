# Nginx site config for the Neon Anime static site.
# NOTE: this file is a template — $PORT is replaced at container boot
# (see Dockerfile). Other $variables ($uri, $scheme, $host, ...) are nginx
# variables and must stay out of the envsubst allow-list in the Dockerfile.
server {
    listen $PORT;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ------------------------------------------------------------------
    # Security headers (applied to every response; locations below use
    # `expires` instead of add_header so inheritance is preserved).
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' https://commondatastorage.googleapis.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Compress text assets.
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-ish cache for static assets (images, icons, vendored libs).
    # No `immutable` here: files are not hash-versioned, so a same-name
    # replacement must become visible within this window.
    location /assets/ {
        expires 7d;
    }

    # Short cache for the JS data files (catalog changes more often).
    location /data/ {
        expires 1h;
    }

    # Serve robots.txt / sitemap.xml with the ACTUAL host instead of the
    # hardcoded GitHub Pages domain, so a Railway deploy gets correct URLs.
    location = /robots.txt {
        # gzip must stay off here: sub_filter cannot rewrite compressed bodies.
        gzip off;
        sub_filter 'https://abolfzl29.github.io/animesodoxjzow9' '$scheme://$host';
        sub_filter_once off;
        sub_filter_types text/plain;
        expires 1d;
    }
    location = /sitemap.xml {
        gzip off;
        sub_filter 'https://abolfzl29.github.io/animesodoxjzow9' '$scheme://$host';
        sub_filter_once off;
        sub_filter_types application/xml text/xml;
        expires 1d;
    }

    # Pretty 404 page.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
