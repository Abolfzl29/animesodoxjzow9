# Nginx site config for the Neon Anime static site.
# NOTE: this file is a template — $PORT is replaced at container boot
# (see Dockerfile). Do not add other $variables here unless you also
# update the envsubst allow-list in the Dockerfile.
server {
    listen $PORT;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Compress text assets.
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for versioned-ish static assets (images, icons).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Short cache for the JS data files (catalog changes more often).
    location /data/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Pretty 404 page.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
