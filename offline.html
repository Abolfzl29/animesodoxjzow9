<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0c">
    <title>آفلاین | نئون انیمه</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <style>
        .offline-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
        .offline-card { width: min(560px, 100%); padding: 42px 28px; border: 1px solid var(--glass-border); border-radius: 24px; background: var(--bg-surface); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
        .offline-icon { font-size: 3rem; margin-bottom: 18px; }
        .offline-card h1 { margin: 0 0 12px; }
        .offline-card p { color: var(--text-muted); line-height: 1.9; margin: 0 0 24px; }
        .offline-card button { border: 0; border-radius: 12px; padding: 12px 22px; color: #fff; background: var(--accent); cursor: pointer; font: inherit; }
    </style>
</head>
<body>
    <main class="offline-page">
        <section class="offline-card" aria-labelledby="offlineTitle">
            <div class="offline-icon" aria-hidden="true">◌</div>
            <h1 id="offlineTitle">اتصال اینترنت برقرار نیست</h1>
            <p>صفحه‌های ذخیره‌شده هنوز قابل مشاهده‌اند. برای باز کردن ویدئو یا دریافت محتوای جدید، اتصال اینترنت را دوباره فعال کن.</p>
            <button type="button" onclick="location.reload()">تلاش دوباره</button>
        </section>
    </main>
</body>
</html>
